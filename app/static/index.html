<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Dictionary · Từ điển Anh–Việt</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#word">Đến ô tra từ</a>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Dictionary, trang chủ">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/><path d="M12 6v15"/></svg>
      <span>Dictionary</span>
    </a>
    <span class="language-pair"><span lang="en">EN</span><span aria-hidden="true">→</span><span>VI</span><span class="sr-only">Từ điển Anh–Việt</span></span>
  </header>
  <main>
    <section class="search-section" aria-labelledby="search-title">
      <h1 id="search-title"><label for="word">Tra từ Anh–Việt</label></h1>
      <form id="lookup-form" role="search">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="word" name="word" type="text" maxlength="120" placeholder="Nhập từ hoặc cụm từ tiếng Anh" required autocomplete="off" autocapitalize="none" spellcheck="false">
          <button id="clear-button" class="clear-button" type="button" aria-label="Xóa từ đang nhập" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
          <button id="submit-button" class="submit-button" type="submit">Tra từ</button>
        </div>
      </form>
      <div id="quick-search" class="quick-search" aria-label="Từ gợi ý để thử tra">
        <span>Thử tra</span><button type="button" data-word="beautiful" lang="en">beautiful</button><button type="button" data-word="bank" lang="en">bank</button><button type="button" data-word="set" lang="en">set</button>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section id="empty-state" class="empty-state" aria-label="Bắt đầu tra cứu">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 13c-6-4-12-4-18-2v27c6-2 12-2 18 2 6-4 12-4 18-2V11c-6-2-12-2-18 2Z"/><path d="M24 13v27M12 18c2-.3 4 0 6 1M12 24c2-.3 4 0 6 1M30 19c2-1 4-1.3 6-1M30 25c2-1 4-1.3 6-1"/></svg>
      <p>Tra nghĩa, xem ví dụ và nghe phát âm.</p>
    </section>
    <section id="results" aria-label="Kết quả tra từ" hidden></section>
  </main>
</body>
</html>
